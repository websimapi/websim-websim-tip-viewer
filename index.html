<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Websim Tip Viewer</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans:opsz,wght@8..144,400;8..144,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <script type="importmap">
    {
      "imports": {
        "marked": "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js",
        "dompurify": "https://cdn.jsdelivr.net/npm/dompurify/dist/purify.es.min.js"
      }
    }
  </script>
</head>
<body>
  <main class="container">
    <header>
      <h1>Websim Tip Viewer</h1>
      <p class="muted">Enter a websim project URL or project id to list tip comments and supporters.</p>
    </header>

    <form id="lookupForm" class="lookup">
      <input id="projectInput" placeholder="https://websim.com/projects/project_abc or project_abc" autocomplete="off" />
      <button type="submit">Lookup</button>
      <button type="button" id="useCurrent">Use Current Project</button>
    </form>

    <section id="results" aria-live="polite" class="results">
      <div id="status" class="status">No results yet.</div>
      <ul id="tipsList" class="tips-list" hidden></ul>
      <div id="pager" class="pager" hidden>
        <button id="loadMore">Load more</button>
      </div>
    </section>

    <footer class="foot">Tip comments are pulled using the Websim comments API (only_tips=true).</footer>
  </main>

  <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
